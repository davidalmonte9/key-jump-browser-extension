<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#1d2028"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- rounded dark tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- faint page lines behind the label -->
  <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="34" x2="104" y2="34"/>
    <line x1="24" y1="94" x2="72" y2="94"/>
  </g>
  <!-- hint label -->
  <rect x="22" y="46" width="84" height="40" rx="9" fill="url(#tag)" stroke="#5a4600" stroke-opacity="0.6" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="76" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1c1c1c" letter-spacing="2">KJ</text>
  <!-- plus badge -->
  <circle cx="106" cy="30" r="15" fill="#c2410c" stroke="#1d2028" stroke-width="4"/>
  <path d="M106 22v16M98 30h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>
